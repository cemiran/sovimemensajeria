# Sovime Mensajería en el VPS de Hostinger (junto a n8n), publicado por Traefik con https.
# Los datos (base, fotos, firmas, sesión de WhatsApp) quedan en ./data del servidor.
# Variables en .env: APP_HOST, JWT_SECRET, TZ (ver .env.example)
services:
  sovime:
    build: .
    container_name: sovime
    restart: unless-stopped
    env_file: .env
    environment:
      - DATA_DIR=/app/data
      - TRUST_PROXY=1
      - OSRM_URL=http://osrm:5000
    volumes:
      - ./data:/app/data
    labels:
      - traefik.enable=true
      - traefik.http.routers.sovime.rule=Host(`${APP_HOST}`)
      - traefik.http.routers.sovime.entrypoints=websecure
      - traefik.http.routers.sovime.tls.certresolver=letsencrypt
      - traefik.http.services.sovime.loadbalancer.server.port=3000
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Motor de rutas propio (OSRM) con el mapa de calles de Baja California: tiempos reales entre paradas, sin costo por uso.
  # El mapa se construye una vez en el servidor con /docker/osrm/build.sh (y se puede actualizar cada mes).
  osrm:
    image: ghcr.io/project-osrm/osrm-backend:v5.27.1
    container_name: sovime-osrm
    restart: unless-stopped
    command: osrm-routed --algorithm mld --max-table-size 500 /data/bc.osrm
    volumes:
      - /docker/osrm/data:/data:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
