# Sovime Mensajería en el VPS de Hostinger (junto a n8n), publicado por Traefik con https.
# Los datos (base, fotos, firmas, sesión de WhatsApp) quedan en ./data del servidor.
# Variables en .env: APP_HOST, JWT_SECRET, TZ (ver .env.example)
services:
  sovime:
    build: .
    container_name: sovime
    restart: unless-stopped
    env_file: .env
    environment:
      - DATA_DIR=/app/data
      - TRUST_PROXY=1
    volumes:
      - ./data:/app/data
    labels:
      - traefik.enable=true
      - traefik.http.routers.sovime.rule=Host(`${APP_HOST}`)
      - traefik.http.routers.sovime.entrypoints=websecure
      - traefik.http.routers.sovime.tls.certresolver=letsencrypt
      - traefik.http.services.sovime.loadbalancer.server.port=3000
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
